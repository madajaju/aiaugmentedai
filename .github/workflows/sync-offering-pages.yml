name: Sync permanent offering pages
on:
  workflow_dispatch:
  schedule:
    - cron: '41 8 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  offering-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out private offering catalog
        uses: actions/checkout@v4
        with:
          repository: paidar-press/offering.ai-augmented
          path: offering-source
          token: ${{ secrets.OFFERINGS_REPO_TOKEN }}
      - name: Generate public marketing pages
        run: |
          node offering-source/scripts/generate-offering-public-pages.js "$GITHUB_WORKSPACE/site"
          node scripts/generate-sitemap.mjs
          node scripts/check-site.mjs
          node scripts/check-offering-pages.mjs
      - name: Remove source checkout before committing
        run: rm -rf offering-source
      - name: Open review PR for public offering pages
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Sync customer-facing offering pages'
          title: 'Sync permanent AI-Augmented offering pages'
          body: |
            Generated from registered customer-facing offerings only.
            Planned/unavailable offerings have non-purchasable pages.
            Check marketing text, related offerings, URLs, and fulfilled actions before merging.
          branch: automation/offering-pages
          delete-branch: true
