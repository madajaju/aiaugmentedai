<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
  <title id="title">AI-Augmented Human Capability Network</title>
  <desc id="desc">A central human capability hexagon connected to six surrounding hexagons representing judgment, context, systems, collaboration, and augmentation.</desc>

  <defs>
    <linearGradient id="purpleStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D4AFF"/>
      <stop offset="1" stop-color="#8F7BFF"/>
    </linearGradient>
    <linearGradient id="blueStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2979D9"/>
      <stop offset="1" stop-color="#6BA6F2"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C99724"/>
      <stop offset="1" stop-color="#E3B84B"/>
    </linearGradient>
    <linearGradient id="centerFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFAFF"/>
      <stop offset="1" stop-color="#F1EDFF"/>
    </linearGradient>
    <linearGradient id="personFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D4AFF"/>
      <stop offset="1" stop-color="#9E8EFF"/>
    </linearGradient>
    <linearGradient id="personFillLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#AAA0FF"/>
      <stop offset="1" stop-color="#D4CEFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#6D4AFF" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E2430" flood-opacity="0.08"/>
    </filter>
    <style>
      .wire { fill:none; stroke:#BFC8D8; stroke-width:2; opacity:.55; }
      .wire-purple { fill:none; stroke:#6D4AFF; stroke-width:2.5; opacity:.62; }
      .wire-blue { fill:none; stroke:#2979D9; stroke-width:2.5; opacity:.56; }
      .wire-gold { fill:none; stroke:#C99724; stroke-width:2.5; opacity:.56; }
      .node-purple { fill:#6D4AFF; }
      .node-blue { fill:#2979D9; }
      .node-gold { fill:#C99724; }
      .bghex { fill:#F7F6FF; opacity:.72; }
      .hex-white { fill:#FFFFFF; }
      .outline-purple { stroke:url(#purpleStroke); stroke-width:5; }
      .outline-blue { stroke:url(#blueStroke); stroke-width:5; }
      .outline-gold { stroke:url(#goldStroke); stroke-width:5; }
      .thin-purple { stroke:#9F8CFF; stroke-width:2; fill:none; opacity:.72; }
      .thin-blue { stroke:#77A9E8; stroke-width:2; fill:none; opacity:.72; }
      .thin-gold { stroke:#E2BD62; stroke-width:2; fill:none; opacity:.72; }
    </style>
  </defs>

