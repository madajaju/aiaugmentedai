<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 -30 780 780" role="img" aria-labelledby="title desc">
<title id="title">AI-Augmented Institute ecosystem — Education</title>
<desc id="desc">A hexagonal ecosystem connecting Education, Government, Industry, Students, Workers, and Citizens around the AI-Augmented Institute and its shared body of knowledge.</desc>
<style>
  text { font-family: 'IBM Plex Sans', Arial, sans-serif; fill:#182033; }
  .label { font-weight:700; font-size:24px; }
  .sub { font-weight:500; font-size:16px; fill:#5d6677; }
  .center { font-weight:700; font-size:30px; fill:#fff; }
  .center-sub { font-weight:500; font-size:18px; fill:#f3eefc; }
  .active-label { fill:#fff; }
  .active-sub { fill:#f3eefc; }
  .small { font-size:15px; fill:#6c7280; }
</style>
<defs>
  <linearGradient id="educationHighlight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a8a"/>
    <stop offset="1" stop-color="#428"/>
  </linearGradient>
</defs>
<polygon points="450,90 690,230 690,490 450,630 210,490 210,230" fill="none" stroke="#D9DDE3" stroke-width="5"/>
<line x1="450" y1="360" x2="450" y2="90" stroke="#d6c9ff" stroke-width="3"/>
<line x1="450" y1="360" x2="690" y2="230" stroke="#c9ddff" stroke-width="3"/>
<line x1="450" y1="360" x2="690" y2="490" stroke="#f2d58b" stroke-width="3"/>
<line x1="450" y1="360" x2="450" y2="630" stroke="#d6c9ff" stroke-width="3"/>
<line x1="450" y1="360" x2="210" y2="490" stroke="#c9ddff" stroke-width="3"/>
<line x1="450" y1="360" x2="210" y2="230" stroke="#f2d58b" stroke-width="3"/>

<g transform="translate(450 90)"><polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="url(#educationHighlight)" stroke="#7c4dff" stroke-width="5"/><text text-anchor="middle" y="-2" class="label active-label">Education</text><text text-anchor="middle" y="26" class="sub active-sub">Research + learning</text></g>
<g transform="translate(690 230)"><polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="#fff" stroke="#2f6fed" stroke-width="4"/><text text-anchor="middle" y="-2" class="label">Government</text><text text-anchor="middle" y="26" class="sub">Mission + trust</text></g>
<g transform="translate(690 490)"><polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="#fff" stroke="#d5a21b" stroke-width="4"/><text text-anchor="middle" y="-2" class="label">Industry</text><text text-anchor="middle" y="26" class="sub">Practice + scale</text></g>
<g transform="translate(450 630)"><polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="url(#educationHighlight)" stroke="#7c4dff" stroke-width="5"/><text text-anchor="middle" y="-2" class="label active-label">Students</text><text text-anchor="middle" y="26" class="sub active-sub">Judgment + readiness</text></g>
<g transform="translate(210 490)"><polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="#fff" stroke="#2f6fed" stroke-width="4"/><text text-anchor="middle" y="-2" class="label">Citizens</text><text text-anchor="middle" y="26" class="sub">Agency + outcomes</text></g>
<g transform="translate(210 230)"><polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="#fff" stroke="#d5a21b" stroke-width="4"/><text text-anchor="middle" y="-2" class="label">Workers</text><text text-anchor="middle" y="26" class="sub">Capability + craft</text></g>

<g transform="translate(450 360)">
  <polygon points="0,-142 123,-71 123,71 0,142 -123,71 -123,-71" fill="#241a3f"/>
  <polygon points="0,-112 97,-56 97,56 0,112 -97,56 -97,-56" fill="none" stroke="#9d7cff" stroke-width="2" stroke-dasharray="5 8"/>
  <text text-anchor="middle" y="-12" class="center">AI-AUGMENTED</text>
  <text text-anchor="middle" y="28" class="center">INSTITUTE</text>
</g>
</svg>
